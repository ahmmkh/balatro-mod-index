name: Validate index data

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Unit tests for the validator
        run: python -m pytest -q scripts/test_validate_index.py

      - name: Validate changed mods (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/validate_index.py --changed-only "$BASE_SHA...$HEAD_SHA"

      - name: Validate every mod (push)
        if: github.event_name == 'push'
        run: python scripts/validate_index.py
