name: Deploy API

# Rebuilds the catalog (index.json + thumbnails) and deploys the Worker whenever mods change.
# Required repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ['mods/**', 'worker/**', 'scripts/**', '.github/workflows/deploy-api.yml']
  workflow_run:
    # Pushes made with GITHUB_TOKEN don't trigger other workflows, so chain explicitly.
    workflows: ['Update Mod Versions']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'ahmmkh/Balatro-Mod-Index' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python scripts/build_index.py
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: worker
      - run: bunx wrangler types && bun run check && bun run test
        working-directory: worker
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply bmi --remote
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: bunx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
